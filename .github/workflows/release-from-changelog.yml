name: Quality Gate and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish this commit's version (needs a dated CHANGELOG)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      should_release: ${{ steps.candidate.outputs.should_release }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt && python -m pip check
      - name: Check repository and installable package
        run: python scripts/check.py --temp-root "$RUNNER_TEMP/quality-gate"
      - name: Detect publication candidate
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          should_release=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$EVENT_NAME" = workflow_dispatch ]; then
              # Manual runs are verification by default; publishing is explicit.
              if [ "$PUBLISH_INPUT" = true ]; then
                should_release=true
              fi
            elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ]; then
              should_release=true
            else
              changed="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
              if grep -Fxq CHANGELOG.md <<< "$changed"; then
                should_release=true
              fi
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  release:
    name: Publish verified commit
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt && python -m pip check
      - name: Build, verify and publish without replacing public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish --output "$RUNNER_TEMP/publication"
