<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nitter 推文控制台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Sidebar -->
      <aside class="rail">
        <div class="brand">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </div>
          <div>
            <div class="brand-name">Nitter Tweets</div>
            <div class="brand-sub">推文监控调度台</div>
          </div>
        </div>

        <nav class="nav" aria-label="导航">
          <button class="tab active" type="button" data-view="overview">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-6h6v6"/></svg>
            控制台总览
          </button>
          <button class="tab" type="button" data-view="groups">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
            分组订阅管理
          </button>
          <button class="tab" type="button" data-view="history">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12.5 7H11v5l4 2.5.8-1.3L12.5 11z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            推送历史
          </button>
          <button class="tab" type="button" data-view="mirror">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
            实例能力诊断
          </button>
          <button class="tab" type="button" data-view="config">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
            插件配置
          </button>
        </nav>

        <div class="rail-section-title">系统状态</div>
        <div class="health-card">
          <div class="health-row">
            <span class="label">调度器</span>
            <span id="railSchedulerStatus" class="pill-status pill-muted"><span class="dot"></span></span>
          </div>
          <div class="health-row">
            <span class="label">后台检查</span>
            <span id="railScheduleStatus" class="pill-status pill-muted"><span class="dot"></span></span>
          </div>
          <div class="health-row">
            <span class="label">推送目标</span>
            <span id="railTargetStatus" class="pill-status pill-muted"><span class="dot"></span></span>
          </div>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <header class="topbar">
          <div>
            <span id="currentTabTitle" class="topbar-title">控制台总览</span>
            <span id="currentTabDesc" class="topbar-sub"></span>
          </div>
          <div class="topbar-actions">
            <button id="themeToggleBtn" class="theme-toggle" type="button" title="切换主题">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8"/></svg>
            </button>
            <span id="lastUpdated" class="mono">-</span>
            <button id="refreshBtn" class="btn btn-sm" type="button">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg>
              刷新
            </button>
          </div>
        </header>

        <div id="alert" class="alert" hidden style="margin: 0 20px;"></div>

        <div class="view-container">
          <section id="overviewView" class="view active"></section>

          <section id="groupsView" class="view">
            <div class="groups-layout">
              <div class="panel" style="padding: 12px;">
                <div class="panel-head">
                  <h3>订阅分组</h3>
                  <button id="createGroupBtn" class="btn btn-sm btn-primary" type="button">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    新建
                  </button>
                </div>
                <div id="groupList" class="group-list"></div>
              </div>
              <div id="groupEditor"></div>
            </div>
          </section>

          <section id="historyView" class="view">
            <div class="toolbar panel" style="padding: 10px 14px;">
              <div class="field" style="flex-direction: row; align-items: center; gap: 4px;">
                <span style="font-size: 13px; font-weight: 600;">分组</span>
                <select id="historyGroupSelect" style="width: auto;"></select>
              </div>
              <div class="field" style="flex-direction: row; align-items: center; gap: 4px;">
                <span style="font-size: 13px; font-weight: 600;">订阅源</span>
                <input id="historyUsername" type="text" placeholder="用户名" style="width: 140px;" />
              </div>
              <div class="field" style="flex-direction: row; align-items: center; gap: 4px;">
                <span style="font-size: 13px; font-weight: 600;">状态</span>
                <select id="historyStatusSelect" style="width: auto;">
                  <option value="">全部</option>
                  <option value="success">已送达</option>
                  <option value="partial_failed">部分失败</option>
                  <option value="failed">发送失败</option>
                </select>
              </div>
              <div class="field" style="flex-direction: row; align-items: center; gap: 4px;">
                <span style="font-size: 13px; font-weight: 600;">条数</span>
                <input id="historyLimit" type="number" min="1" max="50" value="10" style="width: 64px;" />
              </div>
              <button id="historyRefreshBtn" class="btn btn-sm btn-primary" type="button">筛选</button>
              <button id="historyOrphanBtn" class="btn btn-sm btn-ghost" type="button">检查废弃</button>
              <div class="pager">
                <button id="historyPrevBtn" class="btn btn-sm" type="button">上一页</button>
                <span id="historyPageLabel" class="mono" style="font-size: 12px;">1 / 1 页</span>
                <button id="historyNextBtn" class="btn btn-sm" type="button">下一页</button>
              </div>
            </div>
            <div id="historyOrphanResult"></div>
            <div id="historyContent" style="display: flex; flex-direction: column; gap: 8px;"></div>
          </section>

          <section id="mirrorView" class="view">
            <form id="mirrorForm" class="panel">
              <div class="panel-head">
                <h2>Nitter 实例能力检测</h2>
                <span style="font-size: 12px; color: var(--text-muted)">不写推送记录</span>
              </div>
              <div class="editor-grid">
                <label class="field"><span>测试用户名</span><input id="mirrorUsername" type="text" value="nasa" /></label>
                <label class="field"><span>搜索关键词</span><input id="mirrorQuery" type="text" value="nasa" /></label>
                <label class="field"><span>List ID（可选）</span><input id="mirrorListId" type="text" placeholder="纯数字" /></label>
                <label class="field"><span>数量</span><input id="mirrorLimit" type="number" min="1" max="50" value="5" /></label>
                <label class="field editor-grid-full"><span>实例 URL（留空测试全部）</span><input id="mirrorInstance" type="url" placeholder="http://nitter:8080" /></label>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 12px; color: var(--text-muted)">已配置:</span>
                  <div id="instanceList" class="chip-list"></div>
                </div>
                <button id="mirrorProbeBtn" class="btn btn-sm btn-primary" type="submit">开始探测</button>
              </div>
            </form>
            <div id="mirrorResult" style="display: flex; flex-direction: column; gap: 8px;"></div>
          </section>

          <section id="configView" class="view"></section>
        </div>
      </main>

      <div id="toastContainer"></div>

      <div id="confirmDialog" class="dialog" hidden>
        <div class="dialog-panel">
          <h3 id="confirmTitle" class="dialog-title">确认操作？</h3>
          <div id="confirmDesc" class="dialog-desc"></div>
          <div class="dialog-actions">
            <button id="cancelConfirmBtn" class="btn btn-sm" type="button">取消</button>
            <button id="confirmActionBtn" class="btn btn-sm btn-primary" type="button">确认</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
