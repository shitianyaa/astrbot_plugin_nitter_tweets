<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nitter 推文控制台</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      // 首帧即落主题类：深色用户不闪亮色首帧，boot 失败（无 bridge）时页面也保持主题。
      // 只能跟随系统偏好：AstrBot Pages iframe 无 allow-same-origin，浏览器存储不可用；
      // 宿主主题由 app.js 的 initTheme 在 bridge 就绪后接管。
      (function () {
        var dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark-theme", dark);
        root.classList.toggle("light-theme", !dark);
      })();
    </script>
  </head>
  <body>
    <!-- 顶部导航壳：品牌 / 环境徽标 / 主题 / ⌘K / 立即触发检查 + 页签 -->
    <div class="nav-shell">
      <div class="nav-primary">
        <svg class="brand-triangle" viewBox="0 0 75 65" aria-hidden="true">
          <path d="M37.5 0L75 65H0L37.5 0Z" />
        </svg>
        <div class="nav-crumb">
          <span class="org">AstrBot</span>
          <span class="slash">/</span>
          <span class="proj">nitter_tweets</span>
          <span id="railSchedulerStatus" class="badge-env"><span class="dot-live"></span>运行中</span>
        </div>

        <div class="nav-actions">
          <button id="themeToggleBtn" class="nav-btn" type="button" title="切换暗色 / 亮色">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8"/></svg>
            <span id="themeLabel">暗色模式</span>
          </button>
          <button id="cmdkBtn" class="nav-btn" type="button">
            <span>⌘K 快捷面板</span>
          </button>
          <button id="refreshBtn" class="nav-btn btn-primary" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg>
            <span>刷新数据</span>
          </button>
        </div>
      </div>

      <div class="nav-tabs" id="navTabs" role="tablist">
        <button class="tab active" type="button" data-view="overview" role="tab">总览</button>
        <button class="tab" type="button" data-view="groups" role="tab">分组订阅<span id="tabCountGroups" class="tab-count">0</span></button>
        <button class="tab" type="button" data-view="history" role="tab">推送历史<span id="tabCountHistory" class="tab-count">0</span></button>
        <button class="tab" type="button" data-view="mirror" role="tab">实例节点<span id="tabCountInstances" class="tab-count">0</span></button>
        <button class="tab" type="button" data-view="storage" role="tab">存储运维<span id="tabCountStorage" class="tab-count">0 MB</span></button>
        <button class="tab" type="button" data-view="config" role="tab">插件配置<span id="tabCountConfig" class="tab-count">0</span></button>
      </div>
    </div>

    <main class="main">
      <div id="noticeStack" class="notice-stack" aria-live="polite"></div>

      <section id="overviewView" class="view active"></section>

      <section id="groupsView" class="view">
        <div class="section-header">
          <div>
            <h3 id="groupsTitle">订阅分组管理</h3>
            <div class="section-sub">管理博主账号、搜索关键词与推特列表，独立配置检查周期、过滤条件与接收群聊</div>
          </div>
          <button id="createGroupBtn" class="nav-btn btn-primary" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            新建分组
          </button>
        </div>
        <div id="groupsGrid" class="groups-grid"></div>
      </section>

      <section id="historyView" class="view">
        <div class="section-header">
          <div>
            <h3 id="historyTitle">推送历史记录</h3>
            <div class="section-sub">点击任意记录可在右侧抽屉查看推文正文、原推地址、投递群聊及终端执行追踪</div>
          </div>
          <div class="section-tools">
            <!-- 分组 / 状态筛选：原生 select 的展开层由系统绘制（圆角、选中色不可控），
                 改由 app.js 的 createSelect 注入同款自绘下拉 -->
            <span id="historyGroupSelect" class="select-slot" data-label="分组筛选"></span>
            <span id="historyStatusSelect" class="select-slot" data-label="状态筛选"></span>
            <input id="historyUsername" type="text" placeholder="搜索作者账号…" aria-label="作者筛选" />
            <input id="historyLimit" type="number" min="1" max="50" value="20" aria-label="每页条数" />
            <button id="historyRefreshBtn" class="nav-btn btn-primary" type="button">筛选</button>
            <button id="historyOrphanBtn" class="nav-btn" type="button">检查废弃</button>
            <button id="historySelectAllBtn" class="nav-btn" type="button">全选本页</button>
          </div>
        </div>
        <div id="historyOrphanResult"></div>
        <div id="historyContent"></div>
        <div id="historyBatchBar" class="history-batch-bar" hidden></div>
        <div class="pager-bar">
          <span id="historyPageLabel" class="mono">1 / 1 页 · 共 0 条</span>
          <div class="row">
            <button id="historyPrevBtn" class="nav-btn" type="button">上一页</button>
            <button id="historyNextBtn" class="nav-btn" type="button">下一页</button>
          </div>
        </div>
      </section>

      <section id="mirrorView" class="view">
        <div class="section-header">
          <div>
            <h3>Nitter 实例节点诊断</h3>
            <div class="section-sub">测试自建与可用 Nitter 节点的网络连通性、RSS 多用户合并流、HTML 搜索后备爬虫状态</div>
          </div>
          <button id="mirrorProbeBtn" class="nav-btn btn-primary" type="button">运行并发检测探针</button>
        </div>

        <form id="mirrorForm" class="inst-card-large" autocomplete="off">
          <div class="inst-form-grid">
            <label class="field"><span>测试用户名</span><input id="mirrorUsername" type="text" placeholder="如 nasa，留空跳过" autocomplete="off" /></label>
            <label class="field"><span>搜索标签或关键词</span><input id="mirrorQuery" type="text" placeholder="如 #AI 或关键词，留空跳过" autocomplete="off" /></label>
            <label class="field"><span>List ID（可选）</span><input id="mirrorListId" type="text" placeholder="仅限数字，留空跳过" autocomplete="off" /></label>
            <label class="field"><span>测试拉取条数</span><input id="mirrorLimit" type="number" min="1" max="50" value="5" autocomplete="off" /></label>
            <label class="field inst-form-full"><span>实例 URL（留空测试全部）</span><input id="mirrorInstance" type="url" placeholder="如 http://nitter:8080，留空测试全部已配置实例" autocomplete="off" /></label>
          </div>
          <div class="form-footer">
            <div class="row">
              <span class="hint">已配置:</span>
              <div id="instanceList" class="chip-list"></div>
            </div>
            <span class="hint">不写推送记录</span>
          </div>
        </form>

        <div id="mirrorResult"></div>
      </section>

      <section id="storageView" class="view">
        <div class="section-header">
          <div>
            <h3>媒体存储与运维</h3>
            <div class="section-sub">管理推文附带图片/视频本地缓存磁盘占用、已读去重水位线与 SQLite 数据库整理</div>
          </div>
          <div class="row">
            <button id="cleanCacheBtn" class="nav-btn btn-danger" type="button">清空全部媒体缓存</button>
          </div>
        </div>
        <div id="storageContent" class="storage-layout"></div>
      </section>

      <section id="configView" class="view"></section>
    </main>

    <div id="confirmDialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc" hidden>
      <div class="dialog-panel">
        <h3 id="confirmTitle">确认操作？</h3>
        <div id="confirmDesc" class="dialog-desc"></div>
        <div class="dialog-actions">
          <button id="cancelConfirmBtn" class="btn btn-sm" type="button">取消</button>
          <button id="confirmActionBtn" class="btn btn-sm btn-primary" type="button">确认</button>
        </div>
      </div>
    </div>

    <!-- 右侧详情抽屉：分组编辑 / 推文详情共用，内容由 app.js 的 openSheet 填充 -->
    <div id="sheetScrim" class="sheet-scrim"></div>
    <aside id="detailSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-header">
        <h4 id="sheetTitle">详情</h4>
        <button id="sheetCloseBtn" class="sheet-close" type="button" aria-label="关闭">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetFooter" class="sheet-footer"></div>
    </aside>

    <!-- ⌘K 命令面板 -->
    <div id="cmdkOverlay" class="palette-veil" role="dialog" aria-modal="true" aria-label="快捷面板">
      <div class="palette">
        <input id="cmdkInput" class="palette-input" type="text" placeholder="输入命令或跳转到视图…" autocomplete="off" />
        <div id="cmdkList" class="palette-list"></div>
      </div>
    </div>

    <!-- 新建分组弹窗 -->
    <div id="createGroupModal" class="modal-veil" role="dialog" aria-modal="true" aria-labelledby="createGroupTitle">
      <div class="modal">
        <div class="modal-head">
          <span id="createGroupTitle">新建订阅分组</span>
          <button id="createGroupCancelBtn" class="sheet-close" type="button" aria-label="关闭">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <label class="field">
            <span>分组名称</span>
            <input id="createGroupName" type="text" placeholder="例如：动漫资讯" autocomplete="off" />
          </label>
          <div class="field">
            <span>分组类型</span>
            <div id="createGroupType" class="group-type-options"></div>
          </div>
        </div>
        <div class="modal-foot">
          <button id="createGroupCloseBtn" class="btn btn-sm" type="button">取消</button>
          <button id="createGroupSubmitBtn" class="btn btn-sm btn-primary" type="button">创建</button>
        </div>
      </div>
    </div>

    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
