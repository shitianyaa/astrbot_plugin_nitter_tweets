<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nitter 推文控制台</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Sidebar -->
      <aside class="rail">
        <div class="brand">
          <h1 class="brand-title">Nitter Tweets</h1>
          <span class="brand-badge">PRO</span>
        </div>

        <nav class="nav" aria-label="导航">
          <button class="tab active" type="button" data-view="overview">控制台总览</button>
          <button class="tab" type="button" data-view="groups">分组订阅管理</button>
          <button class="tab" type="button" data-view="history">最近推送历史</button>
          <button class="tab" type="button" data-view="mirror">实例能力诊断</button>
        </nav>

        <div class="rail-section-title">系统状态</div>
        <div class="health-box">
          <div class="health-row">
            <span>调度器</span>
            <span id="railSchedulerStatus" class="status-indicator"><span class="status-dot"></span></span>
          </div>
          <div class="health-row">
            <span>后台检查</span>
            <span id="railScheduleStatus" class="status-indicator"><span class="status-dot"></span></span>
          </div>
          <div class="health-row">
            <span>推送目标</span>
            <span id="railTargetStatus" class="status-indicator"><span class="status-dot"></span></span>
          </div>
        </div>
      </aside>

      <!-- Main Area -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <span id="currentTabTitle">控制台总览</span>
            <span id="currentTabDesc" class="topbar-subtitle"></span>
          </div>
          <div class="topbar-actions">
            <button id="themeToggleBtn" class="theme-toggle-pill" type="button" title="切换深/浅主题">
              <span class="theme-toggle-slider"></span>
            </button>
            <span id="lastUpdated" class="mono" style="font-size: 11px; color: var(--text-muted)">-</span>
            <button id="refreshBtn" class="button small" type="button">刷新</button>
          </div>
        </header>

        <div id="alert" class="alert" hidden style="margin: 16px 20px 0;"></div>

        <div class="view-container">
          <!-- 1. Overview -->
          <section id="overviewView" class="view active"></section>

          <!-- 2. Groups -->
          <section id="groupsView" class="view">
            <div class="groups-layout">
              <div class="panel" style="gap: 10px;">
                <div class="panel-head">
                  <h2>订阅分组</h2>
                  <button id="createGroupBtn" class="button primary small" type="button">+ 新建</button>
                </div>
                <div id="groupList" class="group-list"></div>
              </div>
              <div id="groupEditor"></div>
            </div>
          </section>

          <!-- 3. History -->
          <section id="historyView" class="view">
            <div class="toolbar panel" style="padding: 10px 14px;">
              <div class="field" style="flex-direction: row; align-items: center; gap: 6px;">
                <span>分组:</span>
                <select id="historyGroupSelect"></select>
              </div>
              <div class="field" style="flex-direction: row; align-items: center; gap: 6px;">
                <span>订阅源:</span>
                <input id="historyUsername" type="text" placeholder="推特用户名或q:tag" style="width: 160px;" />
              </div>
              <div class="field" style="flex-direction: row; align-items: center; gap: 6px;">
                <span>条数:</span>
                <input id="historyLimit" type="number" min="1" max="50" value="10" style="width: 55px;" />
              </div>
              <button id="historyRefreshBtn" class="button small" type="button">筛选</button>
              <button id="historyOrphanBtn" class="button small ghost" type="button">检查废弃分组历史</button>

              <div class="pager">
                <button id="historyPrevBtn" class="button small" type="button">上一页</button>
                <span id="historyPageLabel" class="mono" style="font-size: 11px;">1 / 1 页</span>
                <button id="historyNextBtn" class="button small" type="button">下一页</button>
              </div>
            </div>

            <div id="historyOrphanResult"></div>
            <div id="historyContent"></div>
          </section>

          <!-- 4. Mirror Probe -->
          <section id="mirrorView" class="view">
            <form id="mirrorForm" class="panel">
              <div class="panel-head">
                <h2>Nitter 实例能力检测</h2>
                <span style="font-size: 11px; color: var(--text-muted)">直接测试连通性，不写入推送记录</span>
              </div>
              <div class="editor-grid">
                <label class="field">
                  <span>测试用户名</span>
                  <input id="mirrorUsername" type="text" value="nasa" />
                </label>
                <label class="field">
                  <span>搜索关键词</span>
                  <input id="mirrorQuery" type="text" value="nasa" />
                </label>
                <label class="field">
                  <span>List ID (可选)</span>
                  <input id="mirrorListId" type="text" placeholder="纯数字" />
                </label>
                <label class="field">
                  <span>测试实例 URL (留空测试全部已配置实例)</span>
                  <input id="mirrorInstance" type="url" placeholder="http://nitter:8080" />
                </label>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 11px; color: var(--text-muted)">已配置实例（点击自动填入）：</span>
                  <div id="instanceList" class="chip-list"></div>
                </div>
                <button id="mirrorProbeBtn" class="button primary small" type="submit">开始探测</button>
              </div>
            </form>
            <div id="mirrorResult"></div>
          </section>
        </div>
      </main>

      <!-- Toast Feedback -->
      <div id="toastContainer"></div>

      <!-- Native Confirm Modal -->
      <div id="confirmDialog" class="dialog" hidden>
        <div class="dialog-panel">
          <h3 id="confirmTitle" class="dialog-title">确认操作？</h3>
          <div id="confirmDesc" class="dialog-desc"></div>
          <div class="dialog-actions">
            <button id="cancelConfirmBtn" class="button small" type="button">取消</button>
            <button id="confirmActionBtn" class="button small primary" type="button">确认</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ES Module App Entry -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
