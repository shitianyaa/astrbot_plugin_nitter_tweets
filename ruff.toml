# Ruff 0.16+ project config for astrbot_plugin_nitter_tweets.
# Keep lint behavior close to historical plugin style: defensive broad catches
# at AstrBot / platform boundaries must not crash the bot process.

target-version = "py310"
line-length = 88

[lint]
# BLE001: many handlers intentionally catch Exception to isolate failures
# (platform API, LLM, download, config). Narrowing them would change runtime
# failure modes; do not "fix" by rewriting catch types.
ignore = ["BLE001"]

[lint.per-file-ignores]
# Diagnostic script; wall-clock stamp is fine without tz.
"scripts/**" = ["DTZ005"]
